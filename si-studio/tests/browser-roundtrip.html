<!doctype html><meta charset="utf-8"><h1>Проверка .siq</h1><pre id="result">Проверяем…</pre><script type="module">
import {initial,step} from '../dist/model.js';import {exportSIQ,importSIQ} from '../dist/siq.js';
try{const p=initial(),q=p.rounds[0].themes[0].questions[0],media=new Map();q.steps[1].duration=7;for(const type of ['image','audio','video']){const s=step(type);s.mediaId=crypto.randomUUID();s.filename='reveal.'+({image:'png',audio:'wav',video:'webm'})[type];s.duration=3;s.wait=false;media.set(s.mediaId,new Blob([type]));q.steps.push(s);}const r=importSIQ(await exportSIQ(p,media)),rq=r.pack.rounds[0].themes[0].questions[0];if(rq.steps.map(s=>s.type).join(',')!=='text,answer,image,audio,video'||rq.steps[1].duration!==7)throw Error('Порядок или таймер');for(const s of rq.steps.slice(2)){if(await r.media.get(s.mediaId).text()!==s.type||s.duration!==3||s.wait!==false)throw Error('Потеря медиа или параметров');}document.querySelector('#result').textContent='PASS: изображение, аудио, видео, порядок, бинарные данные, таймер 7 секунд, длительности и ожидание сохранены после экспорта и импорта.';}catch(e){document.querySelector('#result').textContent='FAIL: '+e.stack;}
</script>
