<!doctype html><meta charset="utf-8"><title>Проверка размеров объединения</title><style>body{margin:0;font:14px Arial;background:#eee}#status{padding:8px}iframe{border:0;display:block;transform:scale(.57);transform-origin:top left}#holder{overflow:hidden}</style><div id="status">Проверка…</div><div id="holder"><iframe src="../dist/"></iframe></div><script>
const frame=document.querySelector('iframe'),[width,height]=(new URLSearchParams(location.search).get('size')||'1280x720').split('x').map(Number);frame.style.width=width+'px';frame.style.height=height+'px';document.querySelector('#holder').style.height=height*.57+'px';
frame.onload=async()=>{try{const doc=frame.contentDocument;for(let n=0;n<100&&!doc.querySelector('[data-action="merge-packs"]');n++)await new Promise(r=>setTimeout(r,40));doc.querySelector('[data-action="merge-packs"]').click();for(let n=0;n<100&&!doc.querySelector('.merge-shell');n++)await new Promise(r=>setTimeout(r,40));const panes=[...doc.querySelectorAll('.merge-pane')].map(x=>{const r=x.getBoundingClientRect();return [r.x,r.y,r.width,r.height,r.bottom]});const badFonts=[...doc.querySelectorAll('.merge-shell *')].filter(x=>parseFloat(frame.contentWindow.getComputedStyle(x).fontSize)<14);const ok=doc.documentElement.scrollWidth<=width&&doc.documentElement.scrollHeight<=height&&panes.length===3&&panes.every(p=>p[4]<=height)&&!badFonts.length;document.querySelector('#status').textContent=(ok?'PASS':'FAIL')+' '+width+'×'+height+' · 3 колонки · границы: '+JSON.stringify(panes)+' · мелкий текст: '+badFonts.length;}catch(err){document.querySelector('#status').textContent='FAIL '+err.stack;}};
</script>
